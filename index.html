<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobbie — Find your next plan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e9f1ff;
        background: #0f2737;
      }

      .page {
        min-height: 100vh;
        padding: clamp(14px, 2vw, 24px);
      }

      .hero {
        min-height: calc(100vh - clamp(28px, 4vw, 48px));
        border: 1px solid rgba(201, 226, 255, 0.24);
        border-radius: 10px;
        overflow: hidden;
        padding: clamp(20px, 2.6vw, 38px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background:
          linear-gradient(180deg, rgba(8, 24, 37, 0.2) 0%, rgba(7, 23, 35, 0.65) 68%, rgba(7, 23, 35, 0.9) 100%),
          url("https://github.com/user-attachments/assets/7769fdc0-76ed-46d7-a3c9-88f3aa5c1b66")
            center top / cover no-repeat;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: stretch;
        gap: 18px;
      }

      .glass {
        border: 1px solid rgba(192, 220, 245, 0.22);
        background: rgba(10, 31, 46, 0.38);
        backdrop-filter: blur(4px);
        border-radius: 12px;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: clamp(16px, 2.2vw, 34px);
        padding: 18px 22px;
        min-width: min(640px, 100%);
      }

      .brand {
        font-size: 2rem;
        line-height: 1;
      }

      .logo {
        margin-right: 8px;
        font-size: 2.15rem;
        font-weight: 500;
      }

      .menu {
        display: flex;
        gap: clamp(14px, 1.6vw, 34px);
        margin-left: 14px;
      }

      .menu span {
        font-size: clamp(0.95rem, 1.2vw, 1.12rem);
        color: #e8f1ff;
      }

      .headline {
        margin-top: auto;
      }

      h1 {
        margin: 0;
        font-family: "Times New Roman", Georgia, serif;
        font-weight: 500;
        line-height: 0.95;
        letter-spacing: -0.02em;
        font-size: clamp(3.2rem, 9.8vw, 10rem);
        color: #ebf4ff;
        text-wrap: balance;
      }

      .bottom {
        margin-top: clamp(20px, 4vw, 54px);
        display: grid;
        grid-template-columns: 1.25fr 2fr 1fr;
        gap: 14px;
      }

      .info {
        color: #e5eef8;
        margin: 0;
        font-size: clamp(1rem, 1.35vw, 1.95rem);
        line-height: 1.3;
      }

      .cta {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1rem, 1.4vw, 1.5rem);
      }

      .meta {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: clamp(20px, 4vw, 52px);
        font-size: clamp(0.95rem, 1.2vw, 1.2rem);
      }

      .meta span,
      .cta span {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      @media (max-width: 1080px) {
        .top {
          flex-direction: column;
          align-items: stretch;
        }

        .nav {
          min-width: 0;
          flex-wrap: wrap;
        }

        .bottom {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <main class="hero">
        <header class="top">
          <nav class="nav glass" aria-label="Main navigation">
            <span class="brand"><span class="logo">✶</span>Hobbie</span>
            <div class="menu">
              <span>About</span>
              <span>Features</span>
            </div>
          </nav>
        </header>

        <section class="headline">
          <h1>Because you deserve better connections.</h1>
        </section>

        <footer class="bottom">
          <p class="info">
            The social app that matches your vibe and helps you make plans for today, not someday.
          </p>
          <div class="meta glass">
            <span>📍 Local-first plans</span>
            <span>✅ Verified people</span>
          </div>
          <div class="cta glass"><span>✉️ Get early access</span></div>
        </footer>
      </main>
    </div>
  </body>
</html>
