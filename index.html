<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hobbie — Find your next plan</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #f8fafc;
        background:
          linear-gradient(145deg, rgba(8, 12, 20, 0.84), rgba(8, 12, 20, 0.62)),
          url("https://github.com/user-attachments/assets/5ded31d0-f435-456c-b049-d78545a4d493")
            center / cover no-repeat fixed;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .hero {
        width: min(760px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(12, 18, 28, 0.56);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        padding: clamp(28px, 6vw, 56px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }

      .eyebrow {
        display: inline-block;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
        color: #c7d6f4;
        margin-bottom: 14px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 4.6vw, 3.2rem);
        line-height: 1.08;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        color: #dbe7ff;
        max-width: 55ch;
      }

      .cta {
        margin-top: 28px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .cta input {
        flex: 1 1 280px;
        min-height: 50px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(8, 12, 20, 0.7);
        color: #f8fafc;
        padding: 0 16px;
        font-size: 0.96rem;
        outline: none;
      }

      .cta input::placeholder {
        color: #a8b5cf;
      }

      .cta input:focus {
        border-color: rgba(147, 197, 253, 0.95);
        box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.2);
      }

      .cta button {
        min-height: 50px;
        border: 0;
        border-radius: 12px;
        padding: 0 22px;
        font-weight: 700;
        font-size: 0.95rem;
        background: linear-gradient(120deg, #60a5fa, #2563eb);
        color: #ffffff;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease;
      }

      .cta button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 26px rgba(37, 99, 235, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <span class="eyebrow">Hobbie</span>
      <h1>Meet people nearby and make plans in minutes.</h1>
      <p>
        Join the waitlist for early access to spontaneous activity matching designed for busy urban professionals.
      </p>
      <form class="cta" aria-label="Early access signup">
        <input type="email" placeholder="Enter email for early access" required />
        <button type="submit">Get Early Access</button>
      </form>
    </main>
  </body>
</html>
